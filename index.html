<h1>Hermes Drive Reader</h1>
<p>Hermes Drive Reader is a personal, single-user tool. It lets its owner copy files from the owner's own Google Drive to the owner's own computer using read-only access (https://www.googleapis.com/auth/drive.readonly). It is not offered to other users.</p>
